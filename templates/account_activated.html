{% block content %}
    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Sabadell Rugby Club | Activació del compte d'usuari</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                background-color: #f2f2f2;
                padding: 20px;
            }

            h1, h2, p {
                margin: 0;
            }

            .container {
                width: fit-content;
                margin: 0 auto;
                background-color: #ffffff;
                padding: 30px;
                border-radius: 10px;
                box-shadow: 0px 3px 10px rgba(0, 0, 0, 0.2);
            }

            .button {
                display: inline-block;
                background-color: #4CAF50;
                color: #ffffff;
                padding: 10px 20px;
                border-radius: 5px;
                text-decoration: none;
                margin-top: 20px;
            }

            .center {
                text-align: center;
                align-items: center;
            }

            .logo {
                max-height: 200px;
            }

        </style>
    </head>
    <body>
    <div class="container">
        <h1>El teu compte ha sigut activat exitosament!</h1><br>
        <p>Gràcies per registrarte a la pàgina web de Sabadell Rugby Club! Ara ja pot iniciar sessió a la nostra pàgina
            web.</p><br>
        <div class="center">
            <img class="logo" src="https://i.postimg.cc/BvGvnW6J/SRCtr.png" alt="Logo Sabadell Rugby Club"/><br>
            <a href="/localhost:3000/" class="button">Torna a la web</a>
        </div>
    </div>
    </body>
    </html>
{% endblock %}
