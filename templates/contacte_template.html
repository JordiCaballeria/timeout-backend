<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Formularie de contacte</title>
</head>
<body>
    <h1>Formulari de contacte</h1>
    <p><strong>Nom:</strong> {{ first_name }} {{ last_name }}</p>
    <p><strong>Correu electrònic:</strong> {{ email }}</p>
    <p><strong>Població:</strong> {{ poblacio }}</p>
    <p><strong>Telèfon:</strong> {{ telefon }}</p>
    <p><strong>Comentaris:</strong> {{ comentaris }}</p>
</body>
</html>
