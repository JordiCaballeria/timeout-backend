<!DOCTYPE html>
<html>
<head>
    <title>Confirmaci&oacute Restabliment contrasenya</title>
    <link rel="icon" type="image/x-icon"
          href="https://1.bp.blogspot.com/-f7cAzdEQ5I4/XTIEfGqwyoI/AAAAAAAAAXE/4h55pcfPOdwuWFCmiEPxisp99DtmTzFmgCPcBGAYYCw/s1600/SRCtr.png">
    <style>
        * {
            box-sizing: border-box;
        }

        input[type=password] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            resize: vertical;
        }

        input[type=submit] {
            /*width: 100%;*/
            background-color: #4CAF50;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 4px;
            margin: 8px 0;
            cursor: pointer;
        }

        input[type=submit]:hover {
            background-color: #45a049;
        }

        .container {
            width: fit-content;
            border-radius: 5px;
            background-color: #f2f2f2;
            padding: 20px;
            margin: auto
        }

        .col-100 {
            float: left;
            width: 100%;
            margin-top: 6px;
        }

        .row::after {
            content: "";
            display: table;
            clear: both;
        }

        @media screen and (max-width: 600px) {
            .container {
                width: 80%;
                margin: auto
            }

            .col-100, input[type=submit] {
                width: 100%;
                margin-top: 0;
            }
        }
    </style>
</head>
<body>
<div class="container">
    {% if validlink %}
        {% if error %}
            <p>{{ error }}</p>
        {% elif msg %}
            <p>{{ msg }}</p>
        {% else %}
            <p>Introdueix una nova contrassenya a continuació.</p>
            <br/>
            <form method="POST" id="password_reset_confirm_form">
                {% csrf_token %}
                <div class="row">
                    <label for="new_password1">Nova contrasenya:</label>
                    <div class="col-100">
                        <input type="password" name="new_password1" required>
                    </div>
                </div>
                <div class="row">
                    <label for="new_password2">Confirmar nova contrasena:</label>
                    <div class="col-100">
                        <input type="password" name="new_password2" required>
                    </div>
                </div>
                <div class="row">
                    <input type="submit" value="Cambiar contrasenya">
                </div>
            </form>
        {% endif %}
    {% else %}
        <p>El enlace de restablecimiento de contraseña no es válido o ha caducado.</p>
    {% endif %}
</div>
</body>
</html>
